name: Release Python SDK

# release-please keeps one release PR open with the next version and changelog.
# Merging it tags X.Y.Z, and the build and publish run in this same workflow:
# a tag made with this workflow's token starts no new run, and PyPI's trusted
# publisher is bound to this file, so it cannot move to a reusable workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to reconcile
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: Build distributions
    needs: release-please
    # A manual run skips release-please, so run on that or on a new release.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    outputs:
      tag: ${{ env.RELEASE_TAG }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade build setuptools twine

      - name: Verify tag matches package version
        run: |
          package_version="$(python setup.py --version)"
          if [ "${package_version}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  check-pypi:
    name: Check PyPI publication
    needs: build
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - name: Check whether this version is already on PyPI
        id: release
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.tag }}
        run: |
          if curl --fail --silent --show-error "https://pypi.org/pypi/omnidimension/${PACKAGE_VERSION}/json" > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to PyPI
    needs:
      - build
      - check-pypi
    if: needs.check-pypi.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs:
      - build
      - check-pypi
      - publish
    if: >-
      ${{
        always()
        && needs.build.result == 'success'
        && needs.check-pypi.result == 'success'
        && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build.outputs.tag }}
          # This job only downloads the built artifact, it never checks the
          # repo out, so `gh` has no git remote to infer the target from and
          # died with "not a git repository". Naming it explicitly is cheaper
          # than a checkout we would otherwise not need.
          GH_REPO: ${{ github.repository }}
        run: |
          # release-please writes the release and its notes; attach the files.
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
            exit 0
          fi
          gh release create "$TAG_NAME" dist/* --generate-notes --title "$TAG_NAME"
