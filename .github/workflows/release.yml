name: Release Python SDK

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to reconcile
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade build setuptools twine

      - name: Verify tag matches package version
        run: |
          package_version="$(python setup.py --version)"
          if [ "${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  check-pypi:
    name: Check PyPI publication
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - name: Check whether this version is already on PyPI
        id: release
        env:
          PACKAGE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          if curl --fail --silent --show-error "https://pypi.org/pypi/omnidimension/${PACKAGE_VERSION}/json" > /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to PyPI
    needs:
      - build
      - check-pypi
    if: needs.check-pypi.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs:
      - build
      - check-pypi
      - publish
    if: >-
      ${{
        always()
        && needs.build.result == 'success'
        && needs.check-pypi.result == 'success'
        && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG_NAME" dist/* --generate-notes --title "$TAG_NAME"
